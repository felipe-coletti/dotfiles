# ─── foot: terminal ─────────────────────────────────────────
# Cores da paleta (.config/colors/palette.css)

font=JetBrainsMono Nerd Font:size=11
pad=12x12

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[colors-dark]
background=1e1e1e
foreground=d4d4d4

# As 16 cores do terminal, no estilo do Dark+ do VS Code. O vermelho é o
# destaque da paleta e o cinza claro é o texto
regular0=2a2a2a
regular1=c0392b
regular2=0dbc79
regular3=e5e510
regular4=2472c8
regular5=bc3fbc
regular6=11a8cd
regular7=d4d4d4

bright0=808080
bright1=e74c3c
bright2=23d18b
bright3=f5f543
bright4=3b8eea
bright5=d670d6
bright6=29b8db
bright7=ffffff

selection-foreground=d4d4d4
selection-background=3a3a3a
urls=3b8eea
cursor=1e1e1e d4d4d4
scrollback-indicator=1e1e1e 808080
