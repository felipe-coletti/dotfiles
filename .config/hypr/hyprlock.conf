# ─── hyprlock: tela de bloqueio ─────────────────────────────
# Cores da paleta (.config/colors/palette.css)
$bg       = rgb(1e1e1e)
$bg_alt   = rgb(2a2a2a)
$border   = rgb(3a3a3a)
$text     = rgb(d4d4d4)
$text_dim = rgb(808080)
$accent   = rgb(c0392b)
$font     = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

background {
    monitor =
    color = $bg
}

# Hora
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 64
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

# Data (segue o locale do sistema)
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $text_dim
    font_size = 14
    font_family = $font
    position = 0, 50
    halign = center
    valign = center
}

# Usuário atual (apenas exibição)
label {
    monitor =
    text = 󰀄  $USER
    color = $text
    font_size = 13
    font_family = $font
    position = 0, 5
    halign = center
    valign = center
}

# Campo de senha
input-field {
    monitor =
    size = 280, 44
    outline_thickness = 2
    rounding = 4
    dots_size = 0.2
    dots_spacing = 0.3
    outer_color = $border
    inner_color = $bg_alt
    font_color = $text
    check_color = $text
    fail_color = $accent
    fade_on_empty = false
    placeholder_text = 󰌾
    font_family = $font
    position = 0, -40
    halign = center
    valign = center
}